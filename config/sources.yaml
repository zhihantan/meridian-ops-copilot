# Config-driven ingestion (T06c): one generated job with a task per source feed. Edit this file, run
# `make gen-jobs`, then deploy. Removing an entry removes its task on the next deploy.
schedule: "0 0 * * * ?"   # hourly; a source with no new files finishes at once (Auto Loader, available now)
timezone: Asia/Singapore
defaults:
  format: json
sources:
  - {name: settlements, system: system_a}
  - {name: chargebacks, system: system_a}
  - {name: merchant_master, system: system_b, format: csv}
  - {name: disputes, system: system_b}
  - {name: fx_rates, system: system_c}
