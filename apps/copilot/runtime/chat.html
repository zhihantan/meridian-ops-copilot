<!doctype html>
<!-- The copilot's chat page (BUILD), served at / by runtime/main.py. It calls this app's own invocation API
     (background with an event stream, as scripts/ask.py does with polling), sending the conversation's
     X-Routing-Key on every request so it stays on one replica. The Apps ingress signs the visitor in and
     forwards their token, so every tool runs as them. Answers are escaped before any formatting. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Ops Copilot</title>
<link rel="icon" href="data:,">
<style>
  :root { --navy: #1B3139; --paper: #F9F7F4; --accent: #FF3621; --ink: #1F2933; --muted: #5A6F77; --line: #E3DED6; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
         font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { background: var(--navy); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 10px;
           flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0 8px 0 0; }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: .03em; padding: 2px 8px; border-radius: 10px; }
  .build { background: var(--muted); color: #fff; }
  .preview { background: #FFAB00; color: var(--navy); }
  header .note { margin-left: auto; font-size: 13px; opacity: .85; }
  main { flex: 1; overflow-y: auto; padding: 24px; }
  #thread { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 0 0 8px; padding-left: 20px; }
  .user { align-self: flex-end; background: var(--navy); color: #fff; white-space: pre-wrap; }
  .assistant { align-self: flex-start; background: #fff; border: 1px solid var(--line); }
  .msg .steps { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
  .steps li { margin: 2px 0; } .steps li.result { padding-left: 14px; }
  .msg .steps:not(:empty) { margin-bottom: 10px; }
  .cite { font-size: 12px; background: #EEF2F3; color: var(--navy); border-radius: 6px; padding: 0 5px; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--muted); }
  .error { color: #B42318; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { font: inherit; font-size: 13px; text-align: left; background: var(--paper); border: 1px solid var(--line);
          border-radius: 16px; padding: 6px 12px; cursor: pointer; }
  .chip:hover { border-color: var(--navy); }
  footer { background: #fff; border-top: 1px solid var(--line); padding: 12px 24px; }
  form { max-width: 880px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; height: 48px; resize: none; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
             border-radius: 10px; }
  button { font: inherit; border-radius: 10px; cursor: pointer; }
  #send { background: var(--accent); color: #fff; border: 0; padding: 0 18px; font-weight: 600; }
  #send:disabled { opacity: .5; cursor: default; }
  #reset { background: none; border: 1px solid var(--line); padding: 0 12px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Meridian Ops Copilot</h1>
  <span class="badge build">BUILD · copilot and this page</span>
  <span class="badge preview">PREVIEW · Agent Bricks runtime</span>
  <span class="note">Every tool runs as you, with your own permissions. Synthetic data.</span>
</header>
<main id="scroll"><div id="thread">
  <div class="msg assistant" id="welcome">
    <p>Ask about payment incidents, runbooks, fees and SLAs. Answers cite the knowledge base and Genie.</p>
    <div class="chips">
      <button class="chip" type="button">Which acquirers are degraded right now, and which runbook should we follow?</button>
      <button class="chip" type="button">How much in refundable failed payments has acq_7 caused in the last 24 hours, and does a refund batch that size need approval?</button>
      <button class="chip" type="button">Which step of RB-014 computes the customer impact?</button>
    </div>
  </div>
</div></main>
<footer><form id="form">
  <textarea id="question" placeholder="Ask the copilot (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="send">Send</button>
  <button id="reset" type="button">New conversation</button>
</form></footer>
<script>
const API = "/api/invocations";
const LABELS = {search_kb: "Searching the knowledge base", ask_genie: "Asking Genie", start_workflow: "Starting the runbook",
                run_step: "Running the next runbook step", remember: "Saving a memory", recall: "Checking memory"};
const thread = document.getElementById("thread"), scroll = document.getElementById("scroll");
const form = document.getElementById("form"), box = document.getElementById("question");
const send = document.getElementById("send");
let history = [];  // earlier questions and answers, oldest first, sent with each question as scripts/ask.py does
let session = crypto.randomUUID();

const escape = text => String(text).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

function render(text) {  // escape first; then paragraphs, bullets, bold, code and citation labels. No links.
  let html = "", list = false;
  for (const line of escape(text).split("\n")) {
    const item = line.match(/^\s*[-*] (.*)$/);
    if (item && !list) { html += "<ul>"; list = true; }
    if (!item && list) { html += "</ul>"; list = false; }
    html += item ? `<li>${item[1]}</li>` : line.trim() ? `<p>${line}</p>` : "";
  }
  return (list ? html + "</ul>" : html)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([A-Z][A-Z0-9-]+ p\.\d+|GENIE-[0-9a-f]{8})\]/g, '<span class="cite">$1</span>');
}

function bubble(kind, html) {
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  div.innerHTML = html;
  thread.appendChild(div);
  scroll.scrollTop = scroll.scrollHeight;
  return div;
}

function step(list, text, kind) {
  const li = document.createElement("li");
  li.textContent = text;
  if (kind) li.className = kind;
  list.appendChild(li);
  scroll.scrollTop = scroll.scrollHeight;
}

function callText(call) {
  const detail = Object.values(call.args || {}).find(v => typeof v === "string") || "";
  return `${LABELS[call.name] || call.name}${detail ? ": " + detail.slice(0, 120) : ""}`;
}

function resultText(content) {  // the loop emits labels and statuses for tool results, never the retrieved text
  let s = {};
  try { s = JSON.parse(content || "{}"); } catch (e) { return "↳ done"; }
  const parts = [];
  if (s.step) parts.push(`step ${s.step}${s.status ? " " + s.status : ""}`);
  for (const k of ["refused", "waiting", "stopped"]) if (s[k]) parts.push(typeof s[k] === "string" ? `${k}: ${s[k]}` : k);
  if (s.approval_id) parts.push(`approval ${s.approval_id}`);
  if (s.total_sgd != null) parts.push(`SGD ${Number(s.total_sgd).toLocaleString("en-SG", {minimumFractionDigits: 2, maximumFractionDigits: 2})}`);
  if (s.sources && s.sources.length) parts.push(`${s.sources.length} source${s.sources.length > 1 ? "s" : ""}: ` +
                                               s.sources.slice(0, 4).join(", ") + (s.sources.length > 4 ? ", …" : ""));
  if (s.note) parts.push(String(s.note).slice(0, 160));
  return `↳ ${parts.join(" · ") || "done"}`;
}

async function call(url, init) {
  const resp = await fetch(url, {credentials: "same-origin", ...init});
  const text = await resp.text();
  let body = {};
  try { body = text ? JSON.parse(text) : {}; } catch (e) { body = {detail: text}; }
  if (!resp.ok) {
    const err = body.error || body.detail || text;
    throw new Error(`${resp.status}: ${typeof err === "string" ? err : err.message || JSON.stringify(err)}`);
  }
  return body;
}

async function readEvents(url, after, onEvent) {  // Server-sent events; returns the last event id read
  const resp = await fetch(`${url}?after=${after}`, {credentials: "same-origin", headers: {"X-Routing-Key": session}});
  if (!resp.ok || !resp.body) return after;
  const reader = resp.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  try {
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, end);
        buffer = buffer.slice(end + 2);
        const field = name => (block.split("\n").find(l => l.startsWith(name + ": ")) || "").slice(name.length + 2);
        if (field("id")) after = Number(field("id"));
        if (field("data")) onEvent(JSON.parse(field("data")));
      }
    }
  } catch (e) { /* a dropped stream resumes from the last event id */ }
  return after;
}

async function ask(question) {
  bubble("user", escape(question));
  const reply = bubble("assistant", '<ul class="steps"></ul><div class="answer"><span class="meta">Working…</span></div>');
  const steps = reply.querySelector(".steps"), answer = reply.querySelector(".answer");
  const started = Date.now(), seconds = () => Math.round((Date.now() - started) / 1000);
  const timer = setInterval(() => { const m = answer.querySelector(".meta"); if (m) m.textContent = `Working… ${seconds()} s`; }, 1000);
  let final = "";
  send.disabled = true;
  try {
    const headers = {"Content-Type": "application/json", "X-Routing-Key": session};
    const accepted = await call(API, {method: "POST", headers, body: JSON.stringify({
      id: crypto.randomUUID(), session_id: session, background: true, stream: true,
      input: {messages: [...history, {role: "user", content: question}]}})});
    let after = 0, state = accepted;
    while (!["completed", "failed"].includes(state.status)) {
      after = await readEvents(accepted.events_url, after, event => {
        const m = event.message;
        if (event.type !== "message" || !m) return;
        if (m.role === "tool") step(steps, resultText(m.content), "result");
        else if (m.tool_calls) m.tool_calls.forEach(c => step(steps, callText(c)));
        else if (m.content) final = m.content;
      });
      state = await call(accepted.status_url, {headers: {"X-Routing-Key": session}});
      if (!["completed", "failed"].includes(state.status)) await new Promise(r => setTimeout(r, 1500));
    }
    if (state.status === "failed") {
      const err = state.error || "the copilot could not answer";
      throw new Error(typeof err === "string" ? err : err.message || JSON.stringify(err));
    }
    if (!final) {
      const out = state.output || {}, messages = (Array.isArray(out) ? out : out.output) || [];
      final = [...messages].reverse().find(m => m.role === "assistant" && m.content)?.content || "";
    }
    answer.innerHTML = render(final || "No answer was returned.") + `<div class="meta">${seconds()} s</div>`;
    if (final) history.push({role: "user", content: question}, {role: "assistant", content: final});
  } catch (e) {
    answer.innerHTML = `<p class="error">${escape(e.message)}</p>`;
  } finally {
    clearInterval(timer);
    send.disabled = false;
    scroll.scrollTop = scroll.scrollHeight;
    box.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const question = box.value.trim();
  if (!question || send.disabled) return;
  box.value = "";
  ask(question);
});
box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
document.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
  if (!send.disabled) ask(chip.textContent);
}));
document.getElementById("reset").addEventListener("click", () => {
  if (send.disabled) return;
  history = [];
  session = crypto.randomUUID();
  [...thread.children].forEach(c => { if (c.id !== "welcome") c.remove(); });
  box.focus();
});
</script>
</body>
</html>
