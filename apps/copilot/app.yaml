command: ["uv", "run", "start-server"]
env:
  - name: MERIDIAN_CONFIG_DIR       # config/ is copied next to the code by scripts/build_copilot.sh
    value: "config"
  - name: MERIDIAN_KB_SCHEMA
    value: "meridian.kb"
  - name: MERIDIAN_AGENT_SCHEMA     # workflow procedures (T18)
    value: "meridian.agent"
  - name: MERIDIAN_GOLD_SCHEMA      # acquirer status check (RB-014 v4, s1b)
    value: "meridian.gold"
