[project]
name = "meridian-copilot"
version = "0.1.0"
description = "Meridian ops copilot: an Anthropic tool loop on the Agent Bricks durable runtime (synthetic data)"
requires-python = ">=3.11"
dependencies = [
    "databricks-agentbricks>=0.5.1",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.124.0",
    "anthropic>=0.70",
    "databricks-ai-search>=0.78",
    "mlflow-skinny>=3.14",   # Unity Catalog trace locations
    "pyyaml>=6.0",
]

[project.scripts]
start-server = "runtime.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot", "runtime", "meridian"]

[tool.uv]
# The Apps container resolves from public PyPI with no lockfile. Resolve as at the deploy of 2026-10-16 19:42 UTC,
# so a redeploy gets the packages that were tested: databricks-agentbricks 0.6.0 (PREVIEW) and newer SDKs came after.
exclude-newer = "2026-10-16T19:42:00Z"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["copilot", "runtime", "meridian"]
