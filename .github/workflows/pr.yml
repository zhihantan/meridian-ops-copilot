# Pull requests (T09): lockfiles, lint, tests and a secret scan; then an ephemeral `ci` deployment that runs
# the integration test against planted.json (a rule-weakening change fails here) and is destroyed after.
name: pr
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  UV_NO_SYNC: "1"   # use the hash-checked environment from install_from_lock.sh; never re-lock in CI
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
      - name: Lockfiles match pyproject (offline; the lockfiles name the mirror they were resolved through)
        run: |
          index="$(grep -m1 -o 'registry = "[^"]*"' uv.lock | cut -d'"' -f2)"
          UV_DEFAULT_INDEX="$index" uv lock --check --offline
          UV_DEFAULT_INDEX="$index" uv lock --check --offline --project envs/serverless-v4
      - run: bash scripts/install_from_lock.sh
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/pytest -q
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    needs: checks
    if: vars.CI_READY == 'true'   # set by scripts/setup_github.sh once the CI credential is in place
    runs-on: ubuntu-latest
    environment: ci
    concurrency: {group: ci-deployment, cancel-in-progress: false}   # one ephemeral deployment at a time
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}   # on behalf of meridian-ci (scripts/setup_github.sh)
      BUNDLE_VAR_ci_service_principal: ${{ secrets.DATABRICKS_CLIENT_ID }}   # the deploying principal is itself
      BUNDLE_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}          # not the principal's own user name
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - run: bash scripts/install_from_lock.sh
      - run: databricks bundle validate -t ci
      - run: databricks bundle deploy -t ci
      - run: bash scripts/ci_integration.sh ci
      - name: Destroy the ephemeral deployment
        if: always()
        run: databricks bundle destroy -t ci --auto-approve
