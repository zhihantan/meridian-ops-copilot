# GitOps (T09): a merge to main deploys staging and runs the integration test; a v* tag deploys prod after
# a required reviewer approves the `prod` environment. Both log the deployment to obs.releases.
name: deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write   # release notes on tags
env:
  UV_NO_SYNC: "1"
jobs:
  staging:
    if: github.ref == 'refs/heads/main' && vars.CI_READY == 'true'   # set by scripts/setup_github.sh
    runs-on: ubuntu-latest
    environment: staging
    concurrency: {group: staging, cancel-in-progress: false}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_ci_service_principal: ${{ secrets.DATABRICKS_CLIENT_ID }}   # the deploying principal is itself
      BUNDLE_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}          # not the principal's own user name
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - run: bash scripts/install_from_lock.sh
      - run: databricks bundle deploy -t staging
      - run: bash scripts/ci_integration.sh staging
      - name: Log the deployment
        run: >-
          databricks bundle run -t staging release_log_job --params
          "kind=deploy,ref=${GITHUB_REF_NAME},sha=${GITHUB_SHA},actor=${GITHUB_ACTOR},run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  prod:
    if: startsWith(github.ref, 'refs/tags/v') && vars.CI_READY == 'true'
    runs-on: ubuntu-latest
    environment: prod   # required reviewer; OAuth M2M secret (a GitHub OIDC federation policy needs account admin)
    concurrency: {group: prod, cancel-in-progress: false}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_ci_service_principal: ${{ secrets.DATABRICKS_CLIENT_ID }}   # the deploying principal is itself
      BUNDLE_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}          # not the principal's own user name
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - run: bash scripts/install_from_lock.sh
      - run: databricks bundle deploy -t prod
      - name: Release notes from the commits since the previous tag
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Log the deployment
        run: >-
          databricks bundle run -t prod release_log_job --params
          "kind=deploy,ref=${GITHUB_REF_NAME},sha=${GITHUB_SHA},actor=${GITHUB_ACTOR},run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
