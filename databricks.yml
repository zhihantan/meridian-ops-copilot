# Meridian Ops Copilot bundle (T01). Host and auth come from the CLI profile in
# DATABRICKS_CONFIG_PROFILE, or in CI from DATABRICKS_HOST plus OAuth credentials, so no workspace
# URL is committed.
bundle:
  name: meridian

include:
  - resources/*.yml
  - resources/generated/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the target
  notification_email:
    description: Recipient for critical alerts and job failures
    default: ${workspace.current_user.userName}
  serverless_environment_version:
    description: Serverless environment version pinned for jobs and local development
    default: "4"
  search_endpoint:
    description: AI Search endpoint shared by the knowledge indexes (created once, outside the bundle)
    default: meridian-search
  embedding_endpoint:
    description: Databricks-managed embedding model for the knowledge indexes
    default: databricks-gte-large-en
  duration_warning_seconds:
    description: Run-duration health rule for the ingest job (dev sets it low so every run exercises the warning)
    default: 900
  acquirer_status_trigger:
    description: Trigger of the acquirer-status job. A fresh deployment has no silver.payments to watch, so staging and ci swap in a paused schedule
    type: complex
    default:
      table_update:
        table_names: ["${var.catalog}.${resources.schemas.silver.name}.payments"]
        condition: ANY_UPDATED
        min_time_between_triggers_seconds: 60
        wait_after_last_change_seconds: 90
  warehouse_id:
    description: SQL warehouse for the governed workflow procedures (T18)
    lookup:
      warehouse: "⚡ Serverless Warehouse ⚡"
  ava_principal:
    description: Ava's service principal (support persona), owner of RB-014 v3
    lookup:
      service_principal: meridian-ava
  ben_principal:
    description: Ben's service principal (finance persona), owner of the RB-014 v4 draft
    lookup:
      service_principal: meridian-ben
  ci_service_principal:
    description: CI service principal (application ID) that deploys and runs staging and prod
    lookup:
      service_principal: meridian-ci

# Every job and pipeline carries its target, so system-table views can tell staging from prod (T06b).
presets:
  tags:
    target: ${bundle.target}

# Admins and the CI principal (which runs staging and prod) manage every deployment; data engineers
# can view.
permissions:
  - level: CAN_MANAGE
    group_name: meridian-admin
  - level: CAN_MANAGE
    service_principal_name: ${var.ci_service_principal}
  - level: CAN_VIEW
    group_name: meridian-de

targets:
  dev:
    # One set of schemas, volumes, jobs and pipelines per developer, with schedules paused.
    mode: development
    default: true
    variables:
      catalog: meridian_dev
      duration_warning_seconds: 120

  # Staging and prod are deployed by CI and run as the CI service principal, from its own folder.
  # Staging is driven by CI (deploy, then the integration test), so its triggers are paused; prod runs them.
  staging:
    presets:
      trigger_pause_status: PAUSED
    workspace:
      root_path: /Workspace/Users/${var.ci_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.ci_service_principal}
    variables:
      catalog: meridian_staging
      acquirer_status_trigger:
        pause_status: PAUSED
        periodic: {interval: 1, unit: DAYS}
    resources:
      pipelines:
        dlc:
          name: "[staging] meridian-dlc"   # same workspace as prod, and pipeline names must be unique

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.ci_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.ci_service_principal}
    variables:
      catalog: meridian

  # Ephemeral per-pull-request deployment in the staging catalog: ci_ schemas, triggers paused, run as the
  # CI principal; the PR workflow runs the integration test and destroys it.
  ci:
    presets:
      name_prefix: "[ci] "
      trigger_pause_status: PAUSED
    workspace:
      root_path: /Workspace/Users/${var.ci_service_principal}/.bundle/${bundle.name}/ci
    run_as:
      service_principal_name: ${var.ci_service_principal}
    variables:
      catalog: meridian_staging
      acquirer_status_trigger:
        pause_status: PAUSED
        periodic: {interval: 1, unit: DAYS}
