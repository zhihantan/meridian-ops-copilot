[project]
name = "meridian"
version = "0.1.0"
description = "Meridian Ops Copilot: governed pipelines, a permission-aware knowledge base and agents on Databricks (synthetic data)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0.2"]

[dependency-groups]
agent = [
    "anthropic>=0.70",
    "databricks-agentbricks>=0.5",
    "databricks-ai-search>=0.78",
]
dbx = [
    "databricks-sdk>=0.70",
]
dev = ["pytest>=8.3", "duckdb>=1.2", "ruff>=0.8"]
synth = ["reportlab>=4.2", "python-docx>=1.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
