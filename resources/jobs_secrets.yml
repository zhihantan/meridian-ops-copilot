# Secrets (T08): a probe that reads the target's Unity Catalog secret as the job identity. The name is
# per environment through var.catalog (meridian_dev, meridian_staging, meridian).
resources:
  jobs:
    secret_probe_job:
      name: meridian-secret-probe
      description: "Reads a Unity Catalog secret as the job identity and prints its fingerprint, never the value."
      tags: {project: meridian-poc}
      parameters:
        - {name: secret, default: "${var.catalog}.secrets.t08_probe"}
      environments:
        - environment_key: default
          spec: {environment_version: "${var.serverless_environment_version}"}
      tasks:
        - task_key: probe
          environment_key: default
          spark_python_task:
            python_file: ../src/meridian/jobs/secret_probe.py
            parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                         --src-dir, "${workspace.file_path}/src", --secret, "{{job.parameters.secret}}",
                         --run-id, "{{job.run_id}}"]
