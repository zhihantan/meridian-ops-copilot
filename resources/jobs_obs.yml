# Observability (T06b, T21): one daily job. It refreshes the observability and knowledge provenance views, exports
# the last 24h of logs and the audit files, snapshots lineage into the changelog, and writes the finance export (a
# new consumer of a gold table). Dev and prod only: staging's integration test refreshes its own views.
targets:
  dev:
    resources:
      jobs: &obs_jobs
        export_logs_job:
          name: meridian-daily
          description: "Daily 00:30 SGT: refresh the views, export logs and audit files, record lineage changes, write the finance export."
          tags: {project: meridian-poc}
          schedule:
            quartz_cron_expression: "0 30 0 * * ?"
            timezone_id: Asia/Singapore
          environments:
            - environment_key: default
              spec: {environment_version: "${var.serverless_environment_version}"}
          email_notifications:
            on_failure: ["${var.notification_email}"]
          tasks:
            - task_key: views
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/obs_views.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --sql-file, "${workspace.file_path}/sql/obs_views.sql",
                             --target, "${bundle.target}", --workspace-id, "{{workspace.id}}", --run-id, "{{job.run_id}}"]
            - task_key: export_logs
              depends_on: [{task_key: views}]
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/export_logs.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
            - task_key: kb_views
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/obs_views.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --sql-file, "${workspace.file_path}/sql/kb_views.sql",
                             --target, "${bundle.target}", --workspace-id, "{{workspace.id}}", --run-id, "{{job.run_id}}"]
            - task_key: export_audit
              depends_on: [{task_key: kb_views}]
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/export_audit.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
            - task_key: lineage_changelog
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/lineage_changelog.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
            - task_key: merchant_export
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/merchant_export.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
  prod:
    resources:
      jobs: *obs_jobs
