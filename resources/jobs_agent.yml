# Post-deploy (T09, T18, T20): run once after each deploy of a target, from the bundle UI. It applies the governed
# procedures (the workflow, feedback and corrections; SQL SECURITY DEFINER, through the SQL warehouse as this job's
# identity), seeds kb.workflows from config/workflows, then records the release in obs.releases. On a fresh target,
# run it after kb_sync has run once (that creates the knowledge tables, kb.corrections among them).
# Dev and prod only: staging runs the integration test alone (resources/jobs_integration.yml).
targets:
  dev:
    resources:
      jobs: &agent_jobs
        workflow_setup_job:
          name: meridian-post-deploy
          description: "After each deploy: create the governed workflow and correction procedures, seed kb.workflows, record the release."
          tags: {project: meridian-poc}
          parameters:
            - {name: kind, default: deploy}
            - {name: ref, default: ""}
            - {name: sha, default: ""}
            - {name: actor, default: ""}
            - {name: run_url, default: ""}
          environments:
            - environment_key: default
              spec:
                environment_version: "${var.serverless_environment_version}"
                dependencies: ["pyyaml>=6.0"]
          tasks:
            - task_key: setup
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/workflow_setup.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src",
                             --sql-file, "${workspace.file_path}/sql/workflow_objects.sql",
                             --sql-file, "${workspace.file_path}/sql/kb_feedback.sql",
                             --workflows-dir, "${workspace.file_path}/config/workflows",
                             --scenario, "${workspace.file_path}/config/scenario.yaml",
                             --warehouse-id, "${var.warehouse_id}",
                             --principal, "ava=${var.ava_principal}", --principal, "ben=${var.ben_principal}",
                             --run-id, "{{job.run_id}}"]
            - task_key: release
              depends_on: [{task_key: setup}]
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/release_log.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --kind, "{{job.parameters.kind}}",
                             --ref, "{{job.parameters.ref}}", --sha, "{{job.parameters.sha}}",
                             --actor, "{{job.parameters.actor}}", --run-url, "{{job.parameters.run_url}}",
                             --run-id, "{{job.run_id}}"]
  prod:
    resources:
      jobs: *agent_jobs
