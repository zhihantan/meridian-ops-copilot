# Orchestration for the governed pipeline (T03, T05, T06): file-arrival, table-update and cron
# triggers, task and cross-job dependencies, and an AT_LEAST_ONE_FAILED escalation path.
# Development mode pauses every trigger; staging and prod run them.
resources:
  jobs:
    ingest_job:
      name: meridian-ingest
      description: "Event-driven: a new payments file runs the pipeline, then the quality checks."
      tags: {project: meridian-poc}
      max_concurrent_runs: 1
      trigger:
        file_arrival:
          url: "/Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.raw.name}/payments/"
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      health:
        rules:
          - {metric: RUN_DURATION_SECONDS, op: GREATER_THAN, value: 900}
      email_notifications:
        on_failure: ["${var.notification_email}"]
        on_duration_warning_threshold_exceeded: ["${var.notification_email}"]
      tasks:
        - task_key: refresh_pipeline
          pipeline_task: {pipeline_id: "${resources.pipelines.dlc.id}"}
        - task_key: quality_checks
          depends_on: [{task_key: refresh_pipeline}]
          run_job_task: {job_id: "${resources.jobs.quality_checks_job.id}"}

    quality_checks_job:
      name: meridian-quality-checks
      description: "Drift, freshness and PII coverage checks; escalates to Slack when any check fails."
      tags: {project: meridian-poc}
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies: ["pyyaml>=6.0"]
      email_notifications:
        on_failure: ["${var.notification_email}"]
      tasks:
        - task_key: drift_check
          environment_key: default
          spark_python_task:
            python_file: ../src/meridian/jobs/quality_checks.py
            parameters: [--check, drift, --fail-on-breach, --catalog, "${var.catalog}",
                         --bronze-schema, "${resources.schemas.bronze.name}",
                         --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
        - task_key: freshness_check
          environment_key: default
          spark_python_task:
            python_file: ../src/meridian/jobs/quality_checks.py
            parameters: [--check, freshness, --fail-on-breach, --catalog, "${var.catalog}",
                         --bronze-schema, "${resources.schemas.bronze.name}",
                         --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
        - task_key: pii_coverage
          environment_key: default
          spark_python_task:
            python_file: ../src/meridian/jobs/quality_checks.py
            parameters: [--check, pii_coverage, --fail-on-breach, --catalog, "${var.catalog}",
                         --bronze-schema, "${resources.schemas.bronze.name}",
                         --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
        - task_key: escalate
          depends_on: [{task_key: drift_check}, {task_key: freshness_check}, {task_key: pii_coverage}]
          run_if: AT_LEAST_ONE_FAILED
          environment_key: default
          spark_python_task:
            python_file: ../src/meridian/jobs/escalate.py
            parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                         --src-dir, "${workspace.file_path}/src",
                         --run-id, "{{job.run_id}}", --slack-secret, "${var.catalog}.secrets.slack_bot_token"]

    gold_refresh_job:
      name: meridian-acquirer-status
      description: "Table-update trigger: rebuild gold.acquirer_status whenever silver.payments changes."
      tags: {project: meridian-poc}
      max_concurrent_runs: 1
      trigger:
        table_update:
          table_names: ["${var.catalog}.${resources.schemas.silver.name}.payments"]
          condition: ANY_UPDATED
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 90
      environments:
        - environment_key: default
          spec: {environment_version: "${var.serverless_environment_version}"}
      tasks:
        - task_key: acquirer_status
          environment_key: default
          spark_python_task:
            python_file: ../src/meridian/jobs/acquirer_status.py
            parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                         --src-dir, "${workspace.file_path}/src",
                         --run-id, "{{job.run_id}}"]

    reprocess_quarantine_job:
      name: meridian-reprocess-quarantine
      description: "Manual: re-run quarantined rows through the current contract rules (idempotent)."
      tags: {project: meridian-poc}
      parameters:
        - {name: rule, default: ""}
        - {name: since_hours, default: "0"}
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies: ["pyyaml>=6.0"]
      tasks:
        - task_key: reprocess
          environment_key: default
          spark_python_task:
            python_file: ../src/meridian/jobs/reprocess_quarantine.py
            parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                         --src-dir, "${workspace.file_path}/src",
                         --rule, "{{job.parameters.rule}}", --since-hours, "{{job.parameters.since_hours}}",
                         --run-id, "{{job.run_id}}"]

    bad_backfill_job:
      name: meridian-backfill-fx-correction
      description: "Demo fault for T06: a backfill that wrongly rewrites one day of silver.payments."
      tags: {project: meridian-poc}
      parameters:
        - {name: days_ago, default: "3"}
      environments:
        - environment_key: default
          spec: {environment_version: "${var.serverless_environment_version}"}
      tasks:
        - task_key: backfill
          environment_key: default
          spark_python_task:
            python_file: ../src/meridian/jobs/bad_backfill.py
            parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                         --src-dir, "${workspace.file_path}/src",
                         --days-ago, "{{job.parameters.days_ago}}", --run-id, "{{job.run_id}}"]
