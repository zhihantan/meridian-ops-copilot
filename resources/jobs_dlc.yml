# Orchestration for the governed pipeline (T03, T05, T06): file-arrival and table-update triggers, task
# dependencies, an AT_LEAST_ONE_FAILED escalation path, and the AI digest. Development mode pauses every trigger;
# prod runs them. Dev and prod only: staging runs the integration test alone (resources/jobs_integration.yml).
targets:
  dev:
    resources:
      jobs: &dlc_jobs
        ingest_job:
          name: meridian-ingest
          description: "Event-driven: a new payments file runs the pipeline, the quality checks, the escalation and the AI digest."
          tags: {project: meridian-poc}
          max_concurrent_runs: 1
          trigger:
            file_arrival:
              url: "/Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.raw.name}/payments/"
              min_time_between_triggers_seconds: 60
              wait_after_last_change_seconds: 60
          health:
            rules:
              - {metric: RUN_DURATION_SECONDS, op: GREATER_THAN, value: "${var.duration_warning_seconds}"}
          email_notifications:
            on_failure: ["${var.notification_email}"]
            on_duration_warning_threshold_exceeded: ["${var.notification_email}"]
          environments:
            - environment_key: default
              spec:
                environment_version: "${var.serverless_environment_version}"
                dependencies: ["pyyaml>=6.0"]
          # Checks fail on purpose, so serverless auto-optimization (which retries failed tasks) is off for them.
          # Each failing check emails, the escalate task posts the run's breaches to Slack, and the digest
          # summarizes quarantine with a pinned model. A run with a breach ends SUCCESS_WITH_FAILURES, which
          # job-level on_failure does not cover, so the check emails are per task.
          tasks:
            - task_key: refresh_pipeline
              pipeline_task: {pipeline_id: "${resources.pipelines.dlc.id}"}
            - task_key: drift_check
              depends_on: [{task_key: refresh_pipeline}]
              environment_key: default
              disable_auto_optimization: true
              email_notifications: {on_failure: ["${var.notification_email}"]}
              spark_python_task:
                python_file: ../src/meridian/jobs/quality_checks.py
                parameters: [--check, drift, --fail-on-breach, --catalog, "${var.catalog}",
                             --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
            - task_key: freshness_check
              depends_on: [{task_key: refresh_pipeline}]
              environment_key: default
              disable_auto_optimization: true
              email_notifications: {on_failure: ["${var.notification_email}"]}
              spark_python_task:
                python_file: ../src/meridian/jobs/quality_checks.py
                parameters: [--check, freshness, --fail-on-breach, --catalog, "${var.catalog}",
                             --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
            - task_key: pii_coverage
              depends_on: [{task_key: refresh_pipeline}]
              environment_key: default
              disable_auto_optimization: true
              email_notifications: {on_failure: ["${var.notification_email}"]}
              spark_python_task:
                python_file: ../src/meridian/jobs/quality_checks.py
                parameters: [--check, pii_coverage, --fail-on-breach, --catalog, "${var.catalog}",
                             --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}"]
            - task_key: escalate
              depends_on: [{task_key: drift_check}, {task_key: freshness_check}, {task_key: pii_coverage}]
              run_if: AT_LEAST_ONE_FAILED
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/escalate.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src",
                             --run-id, "{{job.run_id}}", --slack-secret, "${var.catalog}.secrets.slack_bot_token"]
            - task_key: digest
              depends_on: [{task_key: drift_check}, {task_key: freshness_check}, {task_key: pii_coverage}]
              run_if: ALL_DONE
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/dq_digest.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --run-id, "{{job.run_id}}",
                             --slack-secret, "${var.catalog}.secrets.slack_bot_token"]

        gold_refresh_job:
          name: meridian-acquirer-status
          description: "Table-update trigger: rebuild gold.acquirer_status whenever silver.payments changes."
          tags: {project: meridian-poc}
          max_concurrent_runs: 1
          trigger: ${var.acquirer_status_trigger}  # table update on silver.payments; see databricks.yml
          environments:
            - environment_key: default
              spec: {environment_version: "${var.serverless_environment_version}"}
          tasks:
            - task_key: acquirer_status
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/acquirer_status.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src",
                             --run-id, "{{job.run_id}}"]

        bad_backfill_job:
          name: meridian-backfill-fx-correction
          description: "Demo fault for T06: a backfill that wrongly rewrites one day of silver.payments."
          tags: {project: meridian-poc}
          parameters:
            - {name: days_ago, default: "3"}
          environments:
            - environment_key: default
              spec: {environment_version: "${var.serverless_environment_version}"}
          tasks:
            - task_key: backfill
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/bad_backfill.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src",
                             --days-ago, "{{job.parameters.days_ago}}", --run-id, "{{job.run_id}}"]

        # One recovery job, run as the deploying principal so no person needs standing MODIFY on prod.
        # action=restore: RESTORE an ordinary Delta table to a version (refuses pipeline tables).
        # action=reprocess: re-run quarantined rows through the current contract rules (idempotent).
        restore_table_job:
          name: meridian-recover
          description: "Runbook: restore an ordinary Delta table to a version (action restore), or re-run quarantined rows through the current rules (action reprocess)."
          tags: {project: meridian-poc}
          parameters:
            - {name: action, default: restore}
            - {name: table, default: gold.acquirer_status}
            - {name: version, default: ""}
            - {name: rule, default: ""}
            - {name: since_hours, default: "0"}
          environments:
            - environment_key: default
              spec:
                environment_version: "${var.serverless_environment_version}"
                dependencies: ["pyyaml>=6.0"]
          tasks:
            - task_key: is_restore
              condition_task: {op: EQUAL_TO, left: "{{job.parameters.action}}", right: restore}
            - task_key: restore
              depends_on: [{task_key: is_restore, outcome: "true"}]
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/restore_table.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src", --table, "{{job.parameters.table}}",
                             --version, "{{job.parameters.version}}", --run-id, "{{job.run_id}}"]
            - task_key: is_reprocess
              condition_task: {op: EQUAL_TO, left: "{{job.parameters.action}}", right: reprocess}
            - task_key: reprocess
              depends_on: [{task_key: is_reprocess, outcome: "true"}]
              environment_key: default
              spark_python_task:
                python_file: ../src/meridian/jobs/reprocess_quarantine.py
                parameters: [--catalog, "${var.catalog}", --bronze-schema, "${resources.schemas.bronze.name}",
                             --src-dir, "${workspace.file_path}/src",
                             --rule, "{{job.parameters.rule}}", --since-hours, "{{job.parameters.since_hours}}",
                             --run-id, "{{job.run_id}}"]
  prod:
    resources:
      jobs: *dlc_jobs
